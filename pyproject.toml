[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "suapy"
version = "1.4.0"
description = "Cliente Python e interface de terminal para a API do SUAP."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Kellyson", email = "kellyson.m@escolar.ifrn.edu.br"}]
dependencies = ["requests>=2.25.0", "rich>=10.0.0"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Operating System :: OS Independent",
  "Intended Audience :: Developers",
  "Intended Audience :: Education",
]

[project.optional-dependencies]
pandas = ["pandas>=1.5"]
dev = ["pytest>=7", "build>=1", "twine>=6"]

[project.scripts]
suapy = "suapy.cli:main"

[project.urls]
Repository = "https://github.com/kellyson71/suapy"
Issues = "https://github.com/kellyson71/suapy/issues"
Changelog = "https://github.com/kellyson71/suapy/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["suapy", "suapy.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
